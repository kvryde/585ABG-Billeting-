<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>585ABG Billeting</title>
<style>
:root{--bg:#f6f6f4;--surface:#fff;--ink:#16191a;--muted:#8a9490;--line:#dcdcd6;--accent:#ff453a;--ok:#1f6f5c;--ok-ink:#fff;--stage:#d8d6cf;--phone:#101413;color-scheme:light;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--surface:#1c1c1e;--ink:#f2f2f2;--muted:#8e8e93;--line:#2c2c2e;--ok:#4fb89c;--ok-ink:#06130f;--stage:#0b0e0d;--phone:#050706;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--surface:#1c1c1e;--ink:#f2f2f2;--muted:#8e8e93;--line:#2c2c2e;--ok:#4fb89c;--ok-ink:#06130f;--stage:#0b0e0d;--phone:#050706;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;background:var(--stage);color:var(--ink);overflow:hidden}
#stage{height:100%;display:flex;align-items:center;justify-content:center}
#phone{position:relative;width:min(390px,100%);height:min(820px,100%);background:var(--phone);border-radius:46px;padding:10px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
#screen{position:relative;width:100%;height:100%;border-radius:37px;overflow:hidden;background:var(--bg)}
body.mobile #stage{display:block}
body.mobile #phone{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none;background:var(--bg)}
body.mobile #screen{border-radius:0}
body.mobile #homebar{display:none}
#home{position:absolute;inset:0;background:linear-gradient(165deg,#1d3b34,#0e1d2b 60%,#2b1d3a);color:#fff;padding:54px 22px 22px;display:flex;flex-direction:column}
#clock{text-align:center;margin-top:18px}
#clock b{display:block;font-size:64px;font-weight:300;letter-spacing:-2px}
#clock span{font-size:15px;opacity:.8}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px;margin-top:48px}
.ico{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;background:none;border:0;color:#fff;font-family:inherit;cursor:pointer;position:relative;text-align:center}
.ico i{width:58px;height:58px;border-radius:14px;display:grid;place-items:center;font-style:normal;font-size:26px;background:rgba(255,255,255,.14)}
.ico.app i{background:#f3f1ec;color:#1f6f5c;font-weight:700;flex-direction:column;font-size:11px;line-height:1;padding-top:3px;display:flex;align-items:center;justify-content:center}
.ico.app i em{font-style:normal;font-size:25px;color:#1c2321;margin-top:2px}
.ico.app i small{font-size:9px;color:#c2410c;letter-spacing:.5px}
.badge{position:absolute;top:-5px;right:6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#e5484d;color:#fff;font-size:12px;display:none;place-items:center;font-weight:600}
#dock{margin-top:auto;background:rgba(255,255,255,.14);border-radius:26px;padding:12px;display:flex;justify-content:space-around}
#app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px)}
#app.open{transform:none}
body.mobile #app{transition:none}
header{padding:12px 16px 4px}
body:not(.mobile) header{padding-top:40px}
.ht{display:flex;align-items:center;gap:8px}
.ttl{flex:1;font-size:12px;color:var(--muted);letter-spacing:.3px}
.hb{border:1px solid var(--line);background:var(--surface);color:var(--ink);height:30px;padding:0 12px;border-radius:15px;font:inherit;font-size:12.5px;cursor:pointer}
.hb.on{background:var(--ok);color:var(--ok-ink);border-color:var(--ok)}
h1{font-size:34px;font-weight:700;letter-spacing:-.8px;line-height:1.15;margin-top:2px}
#wd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--line)}
#list{flex:1;overflow-y:auto;overscroll-behavior:contain;position:relative}
.mh{padding:22px 14px 6px;font-size:17px;font-weight:700;color:var(--ink)}
.mh.cur{color:var(--accent)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:40px;border-top:1px solid var(--line);padding-bottom:3px}
.dc{min-height:74px;text-align:center;padding-top:4px;cursor:pointer}
.dc span{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;font-size:19px}
.dc.we span{color:var(--muted)}
.dc.today span{background:var(--accent);color:#fff;font-weight:600}
.ev{margin:1px 2px;padding:2px 6px;border-radius:6px;font-size:12px;line-height:1.25;font-weight:600;overflow-wrap:anywhere;white-space:pre-wrap;cursor:pointer;position:relative;z-index:1}
.ev.l{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.ev.r{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
#pd{display:flex;gap:8px;margin:6px 0 4px}#pd button{flex:1;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}#pd button.on[data-p="paid"]{background:#30d158;color:#06130f;border-color:#30d158;font-weight:600}#pd button.on[data-p="unpaid"]{background:#ff453a;color:#fff;border-color:#ff453a;font-weight:600}.ev small{display:block;font-weight:500;opacity:.9;font-size:11px}
#gate,#pp{position:absolute;inset:0;z-index:14;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}
#gate.on,#pp.on{display:flex}
#gc,#ppc{width:100%;max-width:340px;max-height:100%;overflow-y:auto;text-align:center}
#gc h3,#ppc h3{font-size:22px;margin-bottom:8px}
#gc p{font-size:14.5px;line-height:1.45;color:var(--muted);margin-bottom:16px}
#gc .in{width:100%;margin-bottom:10px;text-align:center}
#gc button,#ppx{width:100%;height:46px;border-radius:14px;border:0;background:var(--ok);color:var(--ok-ink);font:inherit;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px}
.pr{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);text-align:left}
.pr b{flex:1;font-size:14px;min-width:0;overflow-wrap:anywhere}
.pr select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px;font:inherit;font-size:13px}
.pr button{border:0;background:none;color:#ff6b5e;font-size:18px;cursor:pointer;padding:4px 8px}
#fab{position:absolute;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:26px;border:0;background:var(--accent);color:#fff;font-size:30px;line-height:1;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:3}
#shade{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
#shade.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#sheet.on{transform:none}
#sheet h2{font-size:17px;margin-bottom:10px}
#note{width:100%;height:110px;resize:none;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:12px;font:inherit;font-size:15px;line-height:1.4}
#note:focus,.in:focus{outline:2px solid var(--ok);outline-offset:1px}
.row{display:flex;align-items:center;gap:10px;margin:11px 0}
.row label{flex:1;font-size:14px}
.in{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit;font-size:15px;min-width:0}
#sw{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
#sw button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4)}
#sw button.on{border-color:var(--ink)}
#al{width:22px;height:22px;accent-color:var(--ok)}
.btns{display:flex;gap:8px;margin-top:14px}
.btns button{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.btns .go{background:var(--ok);color:var(--ok-ink);border-color:var(--ok);font-weight:600;flex:2}
.btns .del{color:#ff6b5e}
#ring{position:absolute;inset:0;z-index:9;background:rgba(10,14,13,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center;color:#fff}
#ring.on{display:flex}
#ring b{font-size:44px;font-weight:300}
#ring p{font-size:20px;max-width:300px;white-space:pre-wrap}
#ring button{height:50px;padding:0 36px;border-radius:25px;border:0;background:#fff;color:#111;font:inherit;font-size:16px;font-weight:600;cursor:pointer;margin-top:12px}
#toast{position:absolute;left:16px;right:16px;bottom:90px;z-index:8;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-size:13.5px;line-height:1.4;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#pop{position:absolute;inset:0;z-index:13;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:24px}
#pop.on{display:flex}
#popc{width:100%;max-width:320px;background:var(--surface);color:var(--ink);border-radius:24px;padding:26px 22px 18px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#popc svg{width:64px;height:64px;margin-bottom:12px}
#popc h3{font-size:20px;margin-bottom:6px}
#popc p{font-size:14.5px;line-height:1.45;color:var(--muted);margin-bottom:18px}
#popc p b{color:var(--ink)}
#popc button{width:100%;height:46px;border-radius:14px;border:0;font:inherit;font-size:15px;cursor:pointer}
#popy{background:var(--ok);color:var(--ok-ink);font-weight:600;margin-bottom:8px}
#popn{background:none;color:var(--muted)}
#homebar{position:absolute;left:50%;bottom:7px;width:120px;height:5px;margin-left:-60px;border-radius:3px;background:#fff;opacity:.5;z-index:10;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="stage"><div id="phone"><div id="screen">

<div id="home">
  <div id="clock"><b id="ck">9:41</b><span id="cd"></span></div>
  <div id="grid">
    <button class="ico app" id="openApp"><i><small id="icm">MON</small><em id="icd">1</em></i>585ABG Billeting<span class="badge" id="badge"></span></button>
    <button class="ico" disabled style="opacity:.55"><i>✉</i>Mail</button>
    <button class="ico" disabled style="opacity:.55"><i>☺</i>Photos</button>
    <button class="ico" disabled style="opacity:.55"><i>♪</i>Music</button>
  </div>
  <div id="dock">
    <button class="ico" disabled style="opacity:.55"><i>☎</i></button>
    <button class="ico" disabled style="opacity:.55"><i>✆</i></button>
    <button class="ico" disabled style="opacity:.55"><i>◉</i></button>
    <button class="ico" id="dockApp"><i style="background:#f3f1ec;color:#1f6f5c">▤</i></button>
  </div>
</div>

<div id="app">
  <header>
    <div class="ht"><span class="ttl">585ABG Billeting</span><button class="hb" id="ppl" style="display:none">People</button><button class="hb" id="bell">Alerts off</button><button class="hb" id="today">Today</button></div>
    <h1 id="mon"></h1>
  </header>
  <div id="wd"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
  <div id="list"></div>
  <button id="fab" aria-label="New entry">+</button>
</div>

<div id="shade"></div>
<div id="sheet">
  <h2 id="sh">New entry</h2>
  <textarea id="note" placeholder="Type your text here"></textarea>
  <div class="row"><label for="py">Payee</label><input class="in" type="text" id="py" placeholder="Who is the payee?" style="flex:2"></div>
  <div class="row" style="margin-bottom:0"><label>Payment</label></div>
  <div id="pd"><button data-p="unpaid">Unpaid</button><button data-p="paid">Paid</button></div>
  <div class="row"><label for="sd">From</label><input class="in" type="date" id="sd"></div>
  <div class="row"><label for="ed">To</label><input class="in" type="date" id="ed"></div>
  <div class="row" style="margin-bottom:0"><label>Color</label></div>
  <div id="sw"></div>
  <div class="row"><label for="al">Alarm on the first day</label><input type="checkbox" id="al"><input class="in" type="time" id="tm" value="09:00"></div>
  <div class="btns"><button class="del" id="del">Delete</button><button id="cls">Close</button><button class="go" id="sv">Save</button></div>
</div>

<div id="ring"><b id="rt"></b><p id="rx"></p><button id="rd">Dismiss</button></div>
<div id="gate"><div id="gc"><h3 id="gt"></h3><p id="gd"></p><input class="in" id="gn" placeholder="Your name" maxlength="40"><button id="gb">Request access</button></div></div>
<div id="pp"><div id="ppc"><h3>People</h3><div id="pl"></div><button id="ppx">Close</button></div></div>
<div id="toast"></div>
<div id="pop"><div id="popc"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#1f6f5c"/><rect x="22" y="26" width="56" height="52" rx="8" fill="#f3f1ec"/><rect x="22" y="26" width="56" height="14" rx="8" fill="#c2410c"/><rect x="32" y="50" width="36" height="5" rx="2" fill="#1c2321"/><rect x="32" y="62" width="24" height="5" rx="2" fill="#1c2321"/></svg><h3 id="popt">Install 585ABG Billeting</h3><p id="popd">Download it to your phone and open it in one tap, like any other app.</p><button id="popy">Install</button><button id="popn">Not now</button></div></div>
<div id="homebar" title="Home"></div>
</div></div></div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
/* Paste your Firebase details between the quotes to turn on shared access. Leave empty for a single-phone copy. */
var FIREBASE_CONFIG={apiKey:"",authDomain:"",projectId:"",appId:""};
var KEY="bill.v2",D={ev:[],f:null};
var MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
var COL=["#ff453a","#ff9f0a","#ffd60a","#30d158","#64d2ff","#0a84ff","#bf5af2","#ff375f","#ffffff"];
function pad(n){return n<10?"0"+n:""+n}
function k(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function pk(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function fmt12(t){var p=t.split(":"),h=+p[0];return(h%12||12)+":"+p[1]+(h<12?" AM":" PM")}
function esc(s){return s.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function ink(c){var r=parseInt(c.substr(1,2),16),g=parseInt(c.substr(3,2),16),b=parseInt(c.substr(5,2),16);return(r*299+g*587+b*114)/1000>150?"#111":"#fff"}
function load(){try{var r=JSON.parse(localStorage.getItem(KEY));if(r&&r.ev){D=r}else{var o=JSON.parse(localStorage.getItem("zyrell.v1"));if(o){D.f=o.f;Object.keys(o.n||{}).forEach(function(x){var n=o.n[x];D.ev.push({id:x,text:n.text,start:x,end:x,color:COL[5],alarm:n.alarm,time:n.time,fired:n.fired})})}}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
var cloud=null,me=null,role=FIREBASE_CONFIG.apiKey?"none":"admin",started=false,peopleOn=false,F={};
try{F=JSON.parse(localStorage.getItem("bill.fired"))||{}}catch(e){}
function fk(e){return e.id+"|"+e.start+"|"+e.time}
function canEdit(){return role==="editor"||role==="admin"}
load();
var now0=new Date();now0.setHours(0,0,0,0);
if(!D.f){D.f=k(now0);save()}
var start=pk(D.f),end=new Date(start.getFullYear()+10,start.getMonth(),start.getDate());
var expired=now0>end;
var mobile=matchMedia("(max-width:700px)").matches;
document.body.classList.toggle("mobile",mobile);

/* calendar: months stacked downward, events are bars across their days */
function week(Y,M,s,dim){
  var wa=k(new Date(Y,M,Math.max(s,1))),wb=k(new Date(Y,M,Math.min(s+6,dim))),ev=[],lanes=[],h="",c,x;
  D.ev.forEach(function(e){if(e.end>=wa&&e.start<=wb){
    var a=e.start<wa?wa:e.start,b=e.end>wb?wb:e.end;
    ev.push({e:e,sc:pk(a).getDate()-s,ec:pk(b).getDate()-s,l:e.start<wa,r:e.end>wb})}});
  ev.sort(function(p,q){return p.sc-q.sc||(q.ec-q.sc)-(p.ec-p.sc)});
  ev.forEach(function(x){var i=0;while(lanes[i]!==undefined&&lanes[i]>=x.sc)i++;lanes[i]=x.ec;x.lane=i});
  var n=lanes.length+1,tk=k(now0);
  for(c=0;c<7;c++){var day=s+c;if(day<1||day>dim)continue;var key=k(new Date(Y,M,day));
    h+='<div class="dc'+(c%6==0?" we":"")+(key===tk?" today":"")+'" data-k="'+key+'" style="grid-column:'+(c+1)+';grid-row:1/span '+n+'"><span>'+day+'</span></div>'}
  ev.forEach(function(x){var e=x.e;
    h+='<div class="ev'+(x.l?" l":"")+(x.r?" r":"")+'" data-id="'+e.id+'" style="grid-column:'+(x.sc+1)+'/'+(x.ec+2)+';grid-row:'+(x.lane+2)+';background:'+e.color+';color:'+ink(e.color)+'">'+(e.alarm?"\u23f0 ":"")+esc(e.text)+((e.payee||e.paid===true||e.paid===false)?'<small>'+(e.payee?esc(e.payee)+" \u00b7 ":"")+(e.paid?"Paid":"Unpaid")+'</small>':"")+'</div>'});
  return '<div class="wk">'+h+'</div>';
}
function build(){
  if(expired){$("list").innerHTML='<div class="mh">This copy of 585ABG Billeting ran for ten years and has now ended.</div>';return}
  var h="",mi,endM=end.getFullYear()*12+end.getMonth();
  for(mi=start.getFullYear()*12+start.getMonth();mi<=endM;mi++){
    var Y=Math.floor(mi/12),M=mi%12,dim=new Date(Y,M+1,0).getDate(),off=new Date(Y,M,1).getDay(),w;
    h+='<div class="mb" data-m="'+mi+'"><div class="mh'+(Y===now0.getFullYear()&&M===now0.getMonth()?" cur":"")+'">'+MON[M].slice(0,3)+(M===0||mi===start.getFullYear()*12+start.getMonth()?" "+Y:"")+'</div>';
    for(w=0;w*7-off<dim;w++)h+=week(Y,M,w*7-off+1,dim);
    h+='</div>';
  }
  $("list").innerHTML=h;
}
function rebuild(){var t=$("list").scrollTop;build();$("list").scrollTop=t}
var blocks=null;
function label(){
  blocks=blocks||$("list").querySelectorAll(".mb");
  var t=$("list").scrollTop+110,cur=null,i;
  for(i=0;i<blocks.length;i++){if(blocks[i].offsetTop<=t)cur=blocks[i];else break}
  if(cur){var m=+cur.getAttribute("data-m");$("mon").textContent=MON[m%12]+" "+Math.floor(m/12)}
}
var raf=0;$("list").addEventListener("scroll",function(){if(!raf)raf=requestAnimationFrame(function(){raf=0;label()})});
function goToday(smooth){
  var el=$("list").querySelector(".dc.today");if(!el)return;
  var top=el.getBoundingClientRect().top-$("list").getBoundingClientRect().top+$("list").scrollTop-90;
  $("list").scrollTo({top:top,behavior:smooth?"smooth":"auto"});
}

/* editor */
var cur={id:null,color:COL[5],key:null,paid:"unpaid"};
$("sw").innerHTML=COL.map(function(c){return '<button data-c="'+c+'" style="background:'+c+'" aria-label="Color"></button>'}).join("");
function pick(c){cur.color=c;[].forEach.call($("sw").children,function(b){b.classList.toggle("on",b.getAttribute("data-c")===c)})}
$("sw").addEventListener("click",function(e){var b=e.target.closest("button");if(b)pick(b.getAttribute("data-c"))});
function setPaid(v){cur.paid=v;[].forEach.call($("pd").children,function(b){b.classList.toggle("on",b.getAttribute("data-p")===v)})}
$("pd").addEventListener("click",function(e){var b=e.target.closest("button");if(b)setPaid(b.getAttribute("data-p"))});
function idx(id){for(var i=0;i<D.ev.length;i++)if(String(D.ev[i].id)===String(id))return i;return -1}
function openEd(id,key){
  var e=id!=null?D.ev[idx(id)]:null;if(!e&&!canEdit())return;
  cur.id=e?e.id:null;cur.key=key;
  $("sh").textContent=e?"Edit entry":"New entry";
  $("note").value=e?e.text:"";
  $("sd").value=e?e.start:key;$("ed").value=e?e.end:key;
  $("al").checked=!!(e&&e.alarm);$("tm").value=e&&e.time?e.time:"09:00";
  $("del").style.display=e?"":"none";
  pick(e?e.color:COL[5]);$("py").value=e&&e.payee?e.payee:"";setPaid(e&&e.paid?"paid":"unpaid");
  var ro=!canEdit();["note","py","sd","ed","tm","al"].forEach(function(i){$(i).disabled=ro});[].forEach.call(document.querySelectorAll("#sw button,#pd button"),function(b){b.disabled=ro});$("sv").style.display=ro?"none":"";if(ro)$("del").style.display="none";
  $("sheet").classList.add("on");$("shade").classList.add("on");
  if(!e)setTimeout(function(){$("note").focus()},300);
}

/* alerts */
function permState(){return("Notification" in window)?Notification.permission:"unsupported"}
function bellUI(){var s=permState();$("bell").textContent=s==="granted"?"Alerts on":"Alerts off";$("bell").classList.toggle("on",s==="granted")}
function ask(cb){
  if(!("Notification" in window)){cb&&cb(false);return}
  if(Notification.permission==="granted"){cb&&cb(true);return}
  if(Notification.permission==="denied"){toast("Alerts are blocked in your browser settings.");cb&&cb(false);return}
  Notification.requestPermission().then(function(r){bellUI();cb&&cb(r==="granted")})
}
$("bell").onclick=function(){ask(function(ok){if(ok){toast("Alerts are on.");notify("585ABG Billeting","Alerts are working.")}})};
function notify(t,b){
  if(permState()!=="granted")return;
  try{new Notification(t,{body:b})}catch(e){try{navigator.serviceWorker.getRegistration().then(function(r){r&&r.showNotification(t,{body:b})})}catch(x){}}
}
var ac=null,beepT=null;
function beep(){
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    var o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=880;
    o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.0001,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.3,ac.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.4);
    o.start();o.stop(ac.currentTime+.45)}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
}
function ring(e){
  $("rt").textContent=fmt12(e.time);$("rx").textContent=e.text;$("ring").classList.add("on");
  notify("585ABG Billeting \u00b7 "+fmt12(e.time),e.text);
  beep();clearInterval(beepT);beepT=setInterval(beep,1500);
}
$("rd").onclick=function(){$("ring").classList.remove("on");clearInterval(beepT)};
function tick(){
  var d=new Date(),key=k(d),hm=pad(d.getHours())+":"+pad(d.getMinutes()),hit=false;
  D.ev.forEach(function(e){if(e.alarm&&!F[fk(e)]&&e.time&&e.start===key&&hm>=e.time){F[fk(e)]=1;hit=true;ring(e)}});
  if(hit){try{localStorage.setItem("bill.fired",JSON.stringify(F))}catch(x){}badge()}
}
setInterval(tick,5000);
function badge(){
  var key=k(new Date()),c=0;D.ev.forEach(function(e){if(e.alarm&&!F[fk(e)]&&e.start===key)c++});
  $("badge").textContent=c;$("badge").style.display=c?"grid":"none";
}

/* shared access: names, approval, roles */
function gate(t,d,ask){$("gt").textContent=t;$("gd").textContent=d;$("gn").style.display=$("gb").style.display=ask?"":"none";$("gate").classList.add("on")}

    var sc=document.createElement("script");sc.src="https://www.gstatic.com/firebasejs/10.12.2/firebase-"+u[i++]+"-compat.js";sc.onload=nx;
    sc.onerror=function(){gate("No connection","Check your internet and open the app again.",false)};document.head.appendChild(sc)
  })();
